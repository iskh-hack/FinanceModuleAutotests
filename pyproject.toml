[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-module-autotests"
version = "0.1.0"
description = "Внешние QA-автотесты Finance Module"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pytest>=8,<10",
]

[project.optional-dependencies]
reports = ["allure-pytest>=2.13,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "smoke: короткие проверки основного потока",
  "external: тест обращается к развёрнутому окружению",
]
