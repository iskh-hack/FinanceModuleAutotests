[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-module-autotests"
version = "0.2.0"
description = "Функциональные backend-автотесты Finance Module"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pytest>=8,<10",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
reports = ["allure-pytest>=2.13,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "functional: функциональная проверка Finance Module через внешний контракт",
  "smoke: короткая проверка критичного бизнес-потока",
]
